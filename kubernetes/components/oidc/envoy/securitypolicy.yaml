---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: &app ${APP}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: *app
  oidc:
    provider:
      issuer: "https://idm.erwanleboucher.dev/oauth2/openid/${APP}"
      # Avoid discovery through this gateway during Kanidm TLS-secret rollouts.
      authorizationEndpoint: "https://idm.erwanleboucher.dev/ui/oauth2"
      tokenEndpoint: "https://idm.erwanleboucher.dev/oauth2/token"
    clientID: *app
    clientSecret:
      name: "kanidm-${APP}-oidc"
    redirectURL: "https://${SUBDOMAIN:=${APP}}.erwanleboucher.dev/oauth2/callback"
    logoutPath: "/logout"
