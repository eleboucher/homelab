---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name": "multus-vpn",
                "namespace": "kube-system",
                "ips": ["192.168.100.10/24"],
                "mac": "02:90:52:e3:18:5e"
              }]
          dnsConfig:
            nameservers:
              - 1.1.1.1
              - 1.0.0.1
          dnsPolicy: None
          labels:
            egress.home.arpa/custom-egress: "true"
          nodeSelector:
            kubernetes.io/hostname: paris
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        statefulset:
          podManagementPolicy: Parallel
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.3.1
            env:
              QBT_TORRENTING_PORT: "62169"
              TZ: "Europe/Paris"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 0
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      data:
        type: hostPath
        hostPath: /var/mnt/media
        globalMounts:
          - path: /data
      incomplete:
        type: hostPath
        hostPath: /var/mnt/media/downloads/torrents/.incomplete
        globalMounts:
          - path: /incomplete-downloads
      tmp:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            app:
              - path: /tmp

    route:
      app:
        hostnames:
          - qbit.erwanleboucher.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8080

    service:
      app:
        controller: qbittorrent
        forceRename: qbittorrent-app
        ports:
          http:
            port: 8080
            protocol: TCP
