---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
  namespace: downloads
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 1h
  values:
    controllers:
      qui:
        pod:
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        statefulset:
          podManagementPolicy: Parallel
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.37.0
            env:
              - name: TZ
                value: "Europe/Paris"
              - name: QUI__HOST
                value: "0.0.0.0"
              - name: QUI__BASE_URL
                value: "/"
              - name: QUI__PORT
                value: "8080"
              - name: QUI__METRICS_ENABLED
                value: "true"
              - name: QUI__METRICS_HOST
                value: "0.0.0.0"
              - name: QUI__METRICS_PORT
                value: "9000"
              - name: QUI__OIDC_CLIENT_ID
                value: "qui"
              - name: QUI__OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: kanidm-qui-oidc
                    key: client-secret
              - name: QUI__OIDC_DISABLE_BUILT_IN_LOGIN
                value: "true"
              - name: QUI__OIDC_ENABLED
                value: "true"
              - name: QUI__OIDC_ISSUER
                value: "https://idm.erwanleboucher.dev/oauth2/openid/qui"
              - name: QUI__OIDC_REDIRECT_URL
                value: "https://qui.erwanleboucher.dev/api/auth/oidc/callback"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 0
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 384Mi
              limits:
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: qui
        annotations:
          com.dashbrr.service.type: qui
          com.dashbrr.service.url: http://qui.downloads.svc:8080
          com.dashbrr.service.apikey: $${DASHBRR_QUI_API_KEY}
          com.dashbrr.service.name: Qui
        ports:
          http:
            port: 8080
            protocol: TCP
          metrics:
            port: 9000
            protocol: TCP
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - qui.erwanleboucher.dev
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: ${APP}-nfs-media
        globalMounts:
          - path: /data
      config:
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
