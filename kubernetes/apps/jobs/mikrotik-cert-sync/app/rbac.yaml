---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mikrotik-cert-sync
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrole_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mikrotik-cert-sync
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "erwanleboucher-dev-tls"
    verbs:
      - "get"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mikrotik-cert-sync
subjects:
  - kind: ServiceAccount
    name: mikrotik-cert-sync
    namespace: jobs
roleRef:
  kind: ClusterRole
  name: mikrotik-cert-sync
  apiGroup: rbac.authorization.k8s.io
