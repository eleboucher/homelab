# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-exporter
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 10m
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      github-exporter:
        statefulset:
          podManagementPolicy: Parallel
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/eleboucher/github-exporter
              tag: 0.0.6
            env:
              GITHUB_USER: "eleboucher"
              GITHUB_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ghexp-credentials
                    key: GITHUB_TOKEN
              LOG_LEVEL: "debug"
            resources:
              requests:
                cpu: 20m
                memory: 256Mi
              limits:
                memory: 256Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      app:
        ports:
          http:
            port: 2112

    serviceMonitor:
      app:
        endpoints:
          - port: http
            interval: 1m
            scrapeTimeout: 30s

    persistence:
      config:
        type: configMap
        name: ghexp-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
