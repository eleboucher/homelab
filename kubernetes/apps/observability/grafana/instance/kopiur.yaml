---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: grafana-pvc
spec:
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    cache:
      capacity: 5Gi
      mode: Persistent
      storageClassName: miroir-replicated
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  repository:
    kind: ClusterRepository
    name: ovh
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: grafana-pvc
  staging:
    storageClassName: miroir-local
  volumeSnapshotClassName: miroir-snap
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: grafana-pvc
spec:
  policyRef:
    name: grafana-pvc
  schedule:
    cron: H * * * *
