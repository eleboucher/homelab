# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: vl-datasource
spec:
  datasource:
    access: proxy
    type: victoriametrics-logs-datasource
    name: VL
    uid: 227a1e9d-c72e-4e4e-bcec-a3e1f769dee6
    url: http://victoria-logs-server.observability.svc.cluster.local:9428
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: 'trace_id=([0-9a-f]{32})'
          url: '${__value.raw}'
          urlDisplayLabel: View trace
          datasourceUid: 17166a2e-14dc-457c-a942-51bc1ca7e044
  instanceSelector:
    matchLabels:
      dashboards: grafana
  plugins:
    - name: victoriametrics-logs-datasource
      version: "0.16.3"
