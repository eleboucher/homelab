---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgesync
spec:
  interval: 30m
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  values:
    controllers:
      forgesync:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
        containers:
          app:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/forgesync
              tag: 0.0.6
            args:
              - run
            env:
              FORGESYNC_SOURCE_URL: http://forgejo-http:3000
              FORGESYNC_BOT_USERNAME: forgesync-bot
              FORGESYNC_LOG_FORMAT: json
            envFrom:
              - secretRef:
                  name: forgesync-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
