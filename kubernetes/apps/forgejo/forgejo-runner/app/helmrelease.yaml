# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
  interval: 30m
  values:
    forgejo:
      url: http://forgejo-http:3000
      existingSecret: forgejo-runner-secret
    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.2"
    plugin:
      image:
        repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
      # The chart default of 128Mi OOMKills the sidecar under capacity: 3.
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 512Mi
    podLabels:
      app.kubernetes.io/component: forgejo-runner
    runnerConfig: |
      cache:
        enabled: true
        external_server: http://forgejo-cache.forgejo.svc:4000/
        secret_url: file:/etc/forgejo-runner-secret/cache-secret
        proxy_port: 8089
      container:
        docker_host: "-"
        workdir_parent: shared/workdir
      host:
        workdir_parent: /data/act
      kubernetes:
        namespace: forgejo
        poll_timeout: 10m
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: forgejo
            poll_timeout: 10m
            labels: "app.kubernetes.io/name=forgejo-runner-instance,egress.home.arpa/custom-egress=true,kueue.x-k8s.io/queue-name=forgejo-ci"
            queue_timeout: 1h
            resources: |
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      runner:
        capacity: 3
        labels:
          - ubuntu-latest:k8s:///config/podspec-default.yaml
          - default:k8s:///config/podspec-default.yaml
          - docker:k8s:///config/podspec-dind.yaml
          - multiarch:k8s:///config/podspec-dind.yaml  # you need binfmt-misc extension for multiarch
          - heavy:k8s:///config/podspec-heavy.yaml  # long compiles (webkitgtk); see podspec-heavy
        # Ceiling for every job, not a target. webkitgtk needs ~1.5-4h and the
        # previous 3h cut it too fine; ordinary jobs are unaffected.
        timeout: 8h
        shutdown_timeout: 3m
    podSpecs:
      podspec-default.yaml: |
        # Root in a job is nobody on the node.
        hostUsers: false
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              # tar as root restores owners, and ids above 65535 do not exist in the pod.
              - name: TAR_OPTIONS
                value: --no-same-owner
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-26.04@sha256:eafaf4a387a3274e9f199e254c24e4cda927e92bcd888f46f003c81bbbde0bae
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 500m
                memory: 4Gi
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - kharkiv
        restartPolicy: Never
      podspec-heavy.yaml: |
        hostUsers: false
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: TAR_OPTIONS
                value: --no-same-owner
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-26.04@sha256:eafaf4a387a3274e9f199e254c24e4cda927e92bcd888f46f003c81bbbde0bae
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              # Burstable on purpose: at 36Gi request=limit this held
              # oom_score_adj -997 and the kernel killed postgres instead of it.
              requests:
                cpu: "4"
                memory: 8Gi
                ephemeral-storage: 40Gi
              limits:
                cpu: "12"
                memory: 24Gi
                ephemeral-storage: 60Gi
            volumeMounts:
              # $BUILDDIR: the plugin's own "shared" workdir is capped at 10Gi.
              - name: build
                mountPath: /build
        volumes:
          - name: build
            emptyDir:
              sizeLimit: 40Gi
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - kharkiv
        restartPolicy: Never
      podspec-dind.yaml: |
        # Root in a job, privileged dind included, is nobody on the node.
        hostUsers: false
        initContainers:
          - name: dind
            image: docker:29-dind-rootless
            # Rootless dockerd: a pod user namespace cannot write cgroups, so
            # docker run --memory is not enforced; the container limit below is.
            # The shim puts dockerd under rootlesskit after the entrypoint makes the
            # TLS certs. binfmt_misc stays mounted to keep setup-qemu registrations.
            command: [sh, -ec]
            args:
              - |
                chmod -x /usr/local/bin/dind
                echo root:1:65535 > /etc/subuid
                echo root:1:65535 > /etc/subgid
                mkdir -p /run/rootless /shim
                export XDG_RUNTIME_DIR=/run/rootless
                cat > /shim/docker-init <<'SH'
                #!/bin/sh
                shift
                # dockerd copies the first docker-init in PATH into --init containers
                PATH=$(echo "$PATH" | sed "s#/shim:##")
                export PATH
                exec rootlesskit --state-dir=/run/rootless/rk --net=slirp4netns --mtu=1500 --disable-host-loopback --port-driver=builtin --copy-up=/etc --copy-up=/run -p 0.0.0.0:2376:2376/tcp sh -ec '
                  mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || echo "binfmt mount failed"
                  exec /usr/local/bin/docker-init -- "$@" --rootless --data-root=/var/lib/docker
                ' dind "$@"
                SH
                chmod +x /shim/docker-init
                export PATH="/shim:$PATH"
                exec dockerd-entrypoint.sh "$@"
              - dind
              - --ipv6
              - --fixed-cidr-v6=fd00:d1d::/64
            securityContext:
              # Only privileged inside the pod user namespace (hostUsers: false).
              privileged: true
              runAsUser: 0
              runAsGroup: 0
            restartPolicy: Always
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            resources:
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 12Gi
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
              - name: shared
                mountPath: /shared
            startupProbe:
              exec:
                command:
                  - sh
                  - -c
                  - docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
              initialDelaySeconds: 5
              periodSeconds: 1
              failureThreshold: 30
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: TAR_OPTIONS
                value: --no-same-owner
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-26.04@sha256:eafaf4a387a3274e9f199e254c24e4cda927e92bcd888f46f003c81bbbde0bae
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 500m
                memory: 4Gi
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
                readOnly: true
        volumes:
          - name: docker-storage
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - kharkiv
        restartPolicy: Never
