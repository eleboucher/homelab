---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner-ow-ops
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: forgejo-runner-ow-ops
  interval: 1h
  path: "./kubernetes/apps/forgejo/forgejo-runner-ow-ops/app"
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo
  timeout: 5m
  wait: false
