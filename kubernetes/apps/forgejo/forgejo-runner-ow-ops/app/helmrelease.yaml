# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner-ow-ops
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner-ow-ops
  interval: 30m
  values:
    serviceAccount:
      forgejo-runner-ow-ops: {}
    defaultPodOptions:
      automountServiceAccountToken: true
    configMaps:
      config:
        suffix: config
        data:
          runner.yaml: |-
            cache:
              enabled: true
              external_server: http://forgejo-cache.forgejo.svc:4000/
              secret_url: file:/etc/forgejo-runner-secret/cache-secret
              proxy_port: 8089
            container:
              docker_host: "-"
              workdir_parent: shared/workdir
            host:
              workdir_parent: /data/act
            kubernetes:
              namespace: forgejo
              poll_timeout: 10m
            log:
              level: info
            plugins:
              k8s:
                address: "unix:///plugin/forgejo-runner-k8s.sock"
                options:
                  namespace: forgejo
                  poll_timeout: 10m
                  labels: "app.kubernetes.io/name=forgejo-runner-instance,egress.home.arpa/custom-egress=true,kueue.x-k8s.io/queue-name=forgejo-ci"
                  queue_timeout: 1h
                  resources: |
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      memory: 1Gi
            runner:
              capacity: 2
              labels:
                - ubuntu-latest:k8s:///config/podspec-default.yaml
                - default:k8s:///config/podspec-default.yaml
                - docker:k8s:///config/podspec-dind.yaml
                - multiarch:k8s:///config/podspec-dind.yaml  # you need binfmt-misc extension for multiarch
              timeout: 3h
              shutdown_timeout: 3m
          podspec-default.yaml: |-
            # Root in a job is nobody on the node.
            hostUsers: false
            containers:
              - env:
                  - name: DEBIAN_FRONTEND
                    value: noninteractive
                  # tar as root restores owners, and ids above 65535 do not exist in the pod.
                  - name: TAR_OPTIONS
                    value: --no-same-owner
                  - name: CARGO_BUILD_JOBS
                    value: "4"
                  - name: MAKEFLAGS
                    value: "-j4"
                image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-26.04@sha256:dbff4d4aac0d2feec8dc425d1e9d88305d7ea4451b2ec95c068f50b0d5cb7da4
                imagePullPolicy: IfNotPresent
                name: main
                resources:
                  requests:
                    cpu: 1500m
                    memory: 4Gi
                  limits:
                    cpu: 6
                    memory: 20Gi
            # runner-k8s-plugin defaults the shared workdir emptyDir to 10Gi,
            # too small for CEF builds; kubelet evicts the pod on emptydirfs.limit.
            volumes:
              - name: shared
                emptyDir:
                  sizeLimit: 50Gi
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - kharkiv
            restartPolicy: Never
          podspec-dind.yaml: |-
            # Root in a job, privileged dind included, is nobody on the node.
            hostUsers: false
            # One budget for main and dind; requests are ~p90 of 30d usage.
            resources:
              requests:
                cpu: 1500m
                memory: 8Gi
              limits:
                cpu: 10
                memory: 32Gi
            initContainers:
              - name: dind
                image: docker:29-dind-rootless
                # Rootless dockerd: a pod user namespace cannot write cgroups, so
                # docker run --memory is not enforced; the pod limit above is.
                # The shim puts dockerd under rootlesskit after the entrypoint makes the
                # TLS certs. binfmt_misc stays mounted to keep setup-qemu registrations.
                command: [sh, -ec]
                args:
                  - |
                    chmod -x /usr/local/bin/dind
                    echo root:1:65535 > /etc/subuid
                    echo root:1:65535 > /etc/subgid
                    mkdir -p /run/rootless /shim
                    export XDG_RUNTIME_DIR=/run/rootless
                    cat > /shim/docker-init <<'SH'
                    #!/bin/sh
                    shift
                    # dockerd copies the first docker-init in PATH into --init containers
                    PATH=$(echo "$PATH" | sed "s#/shim:##")
                    export PATH
                    exec rootlesskit --state-dir=/run/rootless/rk --net=slirp4netns --mtu=1500 --disable-host-loopback --port-driver=builtin --copy-up=/etc --copy-up=/run -p 0.0.0.0:2376:2376/tcp sh -ec '
                      mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc || echo "binfmt mount failed"
                      exec /usr/local/bin/docker-init -- "$@" --rootless --data-root=/var/lib/docker
                    ' dind "$@"
                    SH
                    chmod +x /shim/docker-init
                    export PATH="/shim:$PATH"
                    exec dockerd-entrypoint.sh "$@"
                  - dind
                  - --ipv6
                  - --fixed-cidr-v6=fd00:d1d::/64
                securityContext:
                  # Only privileged inside the pod user namespace (hostUsers: false).
                  privileged: true
                  runAsUser: 0
                  runAsGroup: 0
                restartPolicy: Always
                env:
                  - name: DOCKER_TLS_CERTDIR
                    value: /certs
                volumeMounts:
                  - name: docker-storage
                    mountPath: /var/lib/docker
                  - name: docker-certs
                    mountPath: /certs
                  - name: shared
                    mountPath: /shared
                startupProbe:
                  exec:
                    command:
                      - sh
                      - -c
                      - docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
                  initialDelaySeconds: 5
                  periodSeconds: 1
                  failureThreshold: 30
            containers:
              - env:
                  - name: DEBIAN_FRONTEND
                    value: noninteractive
                  - name: TAR_OPTIONS
                    value: --no-same-owner
                  - name: DOCKER_HOST
                    value: tcp://localhost:2376
                  - name: DOCKER_TLS_VERIFY
                    value: "1"
                  - name: DOCKER_CERT_PATH
                    value: /certs/client
                  - name: CARGO_BUILD_JOBS
                    value: "4"
                  - name: MAKEFLAGS
                    value: "-j4"
                image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-26.04@sha256:dbff4d4aac0d2feec8dc425d1e9d88305d7ea4451b2ec95c068f50b0d5cb7da4
                imagePullPolicy: IfNotPresent
                name: main
                volumeMounts:
                  - name: docker-certs
                    mountPath: /certs
                    readOnly: true
            volumes:
              - name: docker-storage
                emptyDir: {}
              - name: docker-certs
                emptyDir: {}
              - name: shared
                emptyDir:
                  sizeLimit: 50Gi
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - kharkiv
            restartPolicy: Never
    controllers:
      forgejo-runner-ow-ops:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # must cover runner.shutdown_timeout plus the plugin's 60s cleanup budget
          terminationGracePeriodSeconds: 300
          labels:
            app.kubernetes.io/component: forgejo-runner-ow-ops
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        initContainers:
          # native sidecar: started before, and terminated after, the runner
          # container, so the plugin socket outlives job draining on shutdown
          k8s-plugin:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: 13.3.1
            args:
              - --listen
              - unix:///plugin/forgejo-runner-k8s.sock
            restartPolicy: Always
            # 128Mi OOMKills the sidecar under capacity: 3.
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          runner:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.2.2
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner.yaml \
                  --url "https://git.ow-ops.eu" \
                  --uuid "$(cat /etc/forgejo-runner-secret/uuid)" \
                  --token-url file:///etc/forgejo-runner-secret/token
            resources:
              requests:
                cpu: 5m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    rbac:
      roles:
        forgejo-runner-ow-ops:
          type: Role
          rules:
            - apiGroups:
                - "batch"
              resources:
                - jobs
              verbs:
                - create
                - get
                - list
                - watch
                - delete
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - list
                - watch
                - get
            - apiGroups:
                - ""
              resources:
                - pods/exec
              verbs:
                - create
                - get
            - apiGroups:
                - ""
              resources:
                - pods/log
              verbs:
                - list
                - watch
                - get
      bindings:
        forgejo-runner-ow-ops:
          type: RoleBinding
          roleRef:
            identifier: forgejo-runner-ow-ops
          subjects:
            - identifier: forgejo-runner-ow-ops
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config
      runner-secret:
        type: secret
        name: forgejo-runner-ow-ops-secret
        globalMounts:
          - path: /etc/forgejo-runner-secret
            readOnly: true
      plugins:
        type: emptyDir
        globalMounts:
          - path: /plugin
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: tmp
