---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-sable
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-runner-sable-secret
    creationPolicy: Owner
    template:
      data:
        token: "{{ .token }}"
        uuid: "{{ .uuid }}"
  dataFrom:
    - extract:
        key: forgejo-runner-sable
