---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: frigate-configmap
    files:
      - ./config/config.yml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
# Not in ks.yaml: the FluxInstance defaults replace every child's spec.patches.
patches:
  # A local cache PVC can bind on another node than the staged source; use an emptyDir
  - patch: |-
      - op: replace
        path: /spec/mover/cache
        value:
          mode: Ephemeral
    target:
      kind: SnapshotPolicy
  # The mover is unprivileged and .jwt_secret is root 0600; Frigate regenerates it when missing.
  # ignoreRules replaces Kopiur's defaults, so they are repeated.
  - patch: |-
      - op: add
        path: /spec/files
        value:
          ignoreRules:
            - /lost+found
            - System Volume Information
            - $$RECYCLE.BIN
            - "@eaDir"
            - .snapshot
            - /.jwt_secret
    target:
      kind: SnapshotPolicy
