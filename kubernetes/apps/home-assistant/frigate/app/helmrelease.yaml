---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 30m
  values:
    controllers:
      frigate:
        pod:
          nodeSelector:
            kubernetes.io/hostname: paris
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          podManagementPolicy: Parallel
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.3@sha256:d1a3e0008557bb3f3314d442ecd4ba68e9b16ab7872d64612649f7a6e5156635
            env:
              FRIGATE_CAMERA_HOST: 192.168.1.16
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: frigate-secret
            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /api/version
                    port: 5000
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            resources:
              requests:
                cpu: 200m
              limits:
                memory: 3Gi
            securityContext:
              privileged: true
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: frigate-configmap
        globalMounts:
          - path: /config/config.yml
            readOnly: true
            subPath: config.yml
      media:
        type: nfs
        path: /
        server: normandie.internal
        globalMounts:
          - path: /media/frigate
            subPath: frigate
      cache:
        enabled: true
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
      tmpfs:
        type: emptyDir
        advancedMounts:
          frigate:
            app:
              - path: /tmp
                subPath: tmp
    route:
      frigate:
        hostnames:
          - frigate.erwanleboucher.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: frigate
                port: http
      go2rtc:
        hostnames:
          - frigate-go2rtc.erwanleboucher.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: frigate
                port: go2rtc
    service:
      frigate:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 5000
            primary: true
          go2rtc:
            port: 1984
          rtsp:
            port: 8554
          webrtc-tcp:
            port: 8555
            protocol: TCP
          webrtc-udp:
            port: 8555
            protocol: UDP
      # The iPhone camera (Moblin) pushes RTMP into go2rtc here.
      rtmp:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.69.123"
        controller: frigate
        loadBalancerSourceRanges:
          - 192.168.1.1/32
        ports:
          rtmp:
            port: 1935
    serviceMonitor:
      frigate:
        endpoints:
          - interval: 30s
            path: /api/metrics
            port: http
        service:
          identifier: frigate
