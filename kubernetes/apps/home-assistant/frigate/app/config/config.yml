version: 0.18-0

mqtt:
  host: mosquitto.home-assistant.svc.cluster.local
  user: frigate
  password: "{FRIGATE_MQTT_PASSWORD}"

ffmpeg:
  hwaccel_args: preset-vaapi

detectors:
  ov:
    type: openvino
    device: GPU

model:
  height: 320
  input_dtype: float
  input_tensor: nchw
  labelmap_path: /labelmap/coco-80.txt
  model_type: yolo-generic
  path: /config/model_cache/yolo.onnx
  width: 320

# One connection to the camera, shared by Frigate and Home Assistant: the
# OpenQiara RTSP stream starts on demand and pauses while the shutter is closed.
go2rtc:
  streams:
    openqiara:
      - rtsp://{FRIGATE_CAMERA_HOST}:8554/openqiara

audio:
  enabled: true
  listen:
    - bark
    - breaking
    - fire_alarm
    - howl
    - shatter
    - smoke_detector
    - speech
    - whimper_dog
    - yell
    - yip
  min_volume: 100

objects:
  track:
    - person
    - cat
    - dog

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 0
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion

review:
  alerts:
    labels:
      - bark
      - breaking
      - fire_alarm
      - howl
      - person
      - shatter
      - smoke_detector
      - speech
      - whimper_dog
      - yell
      - yip

snapshots:
  enabled: true
  retain:
    default: 30

networking:
  ipv6:
    enabled: true

cameras:
  openqiara:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/openqiara
          input_args: preset-rtsp-restream
          roles:
            - audio
            - detect
            - record
    detect:
      width: 1280
      height: 720
      fps: 5
