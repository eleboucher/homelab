---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: frigate
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: frigate
  components:
    - ../../../../components/gpu
    - ../../../../components/kopiur/hot
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: miroir
      namespace: miroir-system
    - name: mosquitto
  interval: 1h
  path: "./kubernetes/apps/home-assistant/frigate/app"
  postBuild:
    substitute:
      APP: frigate
      APP_NAMESPACE: home-assistant
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home-assistant
  timeout: 5m
  wait: false
