---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mosquitto-secret
    template:
      data:
        mosquitto_pwd: |
          home-assistant:{{ .MOSQUITTO_HOME_ASSISTANT_PASSWORD }}
          openqiara:{{ .MOSQUITTO_OPENQIARA_PASSWORD }}
          frigate:{{ .MOSQUITTO_FRIGATE_PASSWORD }}
  dataFrom:
    - extract:
        key: mosquitto
