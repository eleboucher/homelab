---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pgmqtt
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/postgres/pass
  dependsOn:
    - name: cnpg-cluster
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/home-assistant/pgmqtt/app
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: home-assistant
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home-assistant
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgmqtt-users
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: pgmqtt
  dependsOn:
    - name: pgmqtt
  interval: 1h
  path: ./kubernetes/apps/home-assistant/pgmqtt/users
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: home-assistant
  timeout: 5m
