---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: flaresolverr
  interval: 1h
  values:
    controllers:
      flaresolverr:
        pod:
          nodeSelector:
            kubernetes.io/hostname: paris
          securityContext:
            runAsUser: &context 1000
            runAsGroup: *context
            fsGroup: *context
            fsGroupChangePolicy: "OnRootMismatch"
          dnsPolicy: ClusterFirst
        replicas: 1
        type: deployment
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/germondai/trawl
              tag: 1.11.1@sha256:f41dac1727c7d0c6d18381279792d89704b36ccfee537262118c7ee32d293ba8
              pullPolicy: IfNotPresent
            env:
              TZ: "Europe/Paris"
              LOG_LEVEL: info
              SESSION_CACHE_DRIVER: memory
              MEMORY_SESSION_CACHE_MAX_ENTRIES: "100"
              BROWSER_POOL_SIZE: "1"
              BROWSER_COLD_BOOT: "true"
              BROWSER_IDLE_TIMEOUT_MS: "1800000"
              FLARESOLVERR_COOKIE_FALLBACK: "true"
              WAF_DETECTION_ENABLED: "false"
              MITM_ENABLED: "true"
              MITM_HOST: "::"
            probes:
              startup: &healthProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8191
                  failureThreshold: 8
                  periodSeconds: 15
                  timeoutSeconds: 15
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8191
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 3
              readiness: *healthProbe
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 3Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: flaresolverr
        ports:
          http:
            port: 8191
          proxy:
            port: 8192
        primary: true
    persistence:
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      proxy-ca:
        type: persistentVolumeClaim
        storageClass: miroir-local
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data/proxy-ca
