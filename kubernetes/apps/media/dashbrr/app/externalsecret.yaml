---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: dashbrr
    creationPolicy: Owner
    template:
      data:
        DASHBRR_AUTOBRR_API_KEY: "{{ .autobrr_key }}"
        DASHBRR_BAZARR_API_KEY: "{{ .bazarr_key }}"
        DASHBRR_JELLYFIN_API_KEY: "{{ .jellyfin_key }}"
        DASHBRR_OVERSEERR_API_KEY: "{{ .jellyseerr_key }}"
        DASHBRR_PROWLARR_API_KEY: "{{ .prowlarr_key }}"
        DASHBRR_RADARR_API_KEY: "{{ .radarr_key }}"
        DASHBRR_SABNZBD_API_KEY: "{{ .sabnzbd_key }}"
        DASHBRR_SONARR_API_KEY: "{{ .sonarr_key }}"
  dataFrom:
    - extract:
        key: homepage-secrets
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr-qui
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: dashbrr-qui
    creationPolicy: Owner
  data:
    - secretKey: DASHBRR_QUI_API_KEY
      remoteRef:
        key: homepage-secrets
        property: qui_key
