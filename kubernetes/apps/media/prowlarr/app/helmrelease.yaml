---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 1h
  values:
    controllers:
      prowlarr:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        statefulset:
          podManagementPolicy: Parallel
        type: statefulset
        containers:
          app:
            image: &image
              repository: ghcr.io/home-operations/prowlarr
              tag: 3.1.0
            env:
              - name: TZ
                value: "Europe/Paris"
              - name: PROWLARR__AUTH__METHOD
                value: External
              - name: PROWLARR__AUTH__REQUIRED
                value: Enabled
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9696
                  initialDelaySeconds: 0
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 18m
                memory: 288Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
        initContainers:
          proxy-ca:
            image: *image
            command:
              - /bin/sh
              - -ec
              - |
                curl --fail --silent --show-error --retry 12 --retry-all-errors \
                  --retry-delay 5 --retry-max-time 120 --max-time 10 \
                  http://flaresolverr.media.svc:8191/proxy-ca.crt -o /trust/trawl-ca.crt
                cat /etc/ssl/certs/ca-certificates.crt /trust/trawl-ca.crt > /trust/ca-certificates.crt
            securityContext: *securityContext
    service:
      app:
        controller: prowlarr
        annotations:
          com.dashbrr.service.type: prowlarr
          com.dashbrr.service.url: http://prowlarr.media.svc:9696
          com.dashbrr.service.apikey: $${DASHBRR_PROWLARR_API_KEY}
          com.dashbrr.service.name: Prowlarr
        ports:
          http:
            port: 9696
            protocol: TCP
    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - prowlarr.erwanleboucher.dev
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      trust:
        type: emptyDir
        advancedMounts:
          prowlarr:
            proxy-ca:
              - path: /trust
            app:
              - path: /etc/ssl/certs/ca-certificates.crt
                subPath: ca-certificates.crt
                readOnly: true
