---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: sonarr
  interval: 1h
  values:
    controllers:
      sonarr:
        pod:
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        type: deployment
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2800
            env:
              - name: TZ
                value: "Europe/Paris"
              - name: SONARR__AUTH__METHOD
                value: Oidc
              - name: SONARR__AUTH__REQUIRED
                value: Enabled
              - name: SONARR__AUTH__OIDCAUTHORITY
                value: https://idm.erwanleboucher.dev/oauth2/openid/sonarr
              - name: SONARR__AUTH__OIDCCLIENTID
                value: sonarr
              - name: SONARR__AUTH__OIDCCLIENTSECRET
                valueFrom:
                  secretKeyRef:
                    name: kanidm-sonarr-oidc
                    key: client-secret
              - name: SONARR__AUTH__OIDCUSERIDENTIFIER
                value: "565c8455-aacb-47d5-9cf7-3fbdda096686"
              - name: SONARR__AUTH__OIDCSCOPES
                value: "openid profile email"
              - name: SONARR__SERVER__TRUSTEDNETWORKS
                value: "10.42.0.0/16,fd42::/56"
              - name: SONARR__SERVER__ALLOWEDHOSTS
                value: "sonarr.erwanleboucher.dev,sonarr,sonarr.media,sonarr.media.svc,sonarr.media.svc.cluster.local"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    httpHeaders:
                      - name: Host
                        value: sonarr.media
                    path: /ping
                    port: 8989
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 90m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    service:
      app:
        controller: sonarr
        annotations:
          com.dashbrr.service.type: sonarr
          com.dashbrr.service.url: http://sonarr.media.svc:8989
          com.dashbrr.service.apikey: $${DASHBRR_SONARR_API_KEY}
          com.dashbrr.service.name: Sonarr
        ports:
          http:
            port: 8989
            protocol: TCP
    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - sonarr.erwanleboucher.dev
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      data:
        type: persistentVolumeClaim
        existingClaim: ${APP}-nfs-media
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
