---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: default-dual-stack
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - services
        scope: Namespaced
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          !has(object.spec.ipFamilyPolicy) ?
            [JSONPatch{op: "add", path: "/spec/ipFamilyPolicy", value: "PreferDualStack"}] :
            []
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: default-dual-stack
spec:
  policyName: default-dual-stack
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - default
            - kube-system
            - nfs
