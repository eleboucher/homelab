# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      ipFamilyPolicy: "PreferDualStack"
      name: kube-dns
      clusterIPs:
        - 10.43.0.10
        - fd43::a
    replicaCount: 2
    servers:
      - zones:
          - zone: internal
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: file
            parameters: /etc/coredns/internal.db internal
          - name: cache
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          # No autopath: it answers the search-path name with a CNAME, and
          # Cilium keys toFQDNs on the query name, so any FQDN policy would
          # match nothing. cilium/cilium#20191.
          - name: hosts
            configBlock: |-
              192.168.1.40 normandie.internal normandie
              192.168.1.41 kharkiv.k8s.internal kharkiv
              192.168.1.42 paris.k8s.internal paris k8s.internal
              192.168.1.2 router.erwanleboucher.dev router
              fallthrough
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    zoneFiles:
      - filename: internal.db
        domain: internal
        contents: |-
          internal. 60 IN SOA ns.internal. hostmaster.internal. 1 60 60 60 60
          internal. 60 IN NS ns.internal.
          ns.internal. 60 IN A 192.168.1.2
          normandie.internal. 60 IN A 192.168.1.40
          kharkiv.k8s.internal. 60 IN A 192.168.1.41
          paris.k8s.internal. 60 IN A 192.168.1.42
          k8s.internal. 60 IN A 192.168.1.42
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
