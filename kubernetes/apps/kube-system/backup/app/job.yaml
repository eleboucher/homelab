---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant-backup-sync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: backup
  values:
    controllers:
      main:
        type: cronjob
        cronjob:
          # Run at 5:00 AM every Sunday
          schedule: "0 5 * * 0"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: rclone/rclone
              tag: 1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
            env:
              - name: RCLONE_CONFIG
                value: "/tmp/rclone.conf"
            command:
              - "/bin/sh"
              - "-c"
            args:
              - |
                echo "🚀 Starting Offsite Sync to Google Drive..."

                cp /config-ro/rclone.conf /tmp/rclone.conf
                chmod 600 /tmp/rclone.conf

                rclone sync /data/backups/homeassistant gdrive:homeassistant-backups \
                  --transfers 16 \
                  --checkers 16 \
                  --fast-list \
                  --delete-after \
                  --log-level INFO \
                  --stats 1m \
                  --retries 3
                echo "✅ Offsite Sync Complete!"

            resources:
              requests:
                memory: 256Mi
              limits:
                memory: 2Gi

    persistence:
      config:
        type: secret
        name: google-drive-backup
        globalMounts:
          - path: /config-ro

      data:
        type: nfs
        server: normandie.internal
        path: /
        globalMounts:
          - path: /data
