      "plugins": [
        {
          "type": "macvlan",
          "master": "lacp0.100",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              { "dst": "0.0.0.0/5", "gw": "192.168.100.1" },
              { "dst": "8.0.0.0/7", "gw": "192.168.100.1" },
              { "dst": "11.0.0.0/8", "gw": "192.168.100.1" },
              { "dst": "12.0.0.0/6", "gw": "192.168.100.1" },
              { "dst": "16.0.0.0/4", "gw": "192.168.100.1" },
              { "dst": "32.0.0.0/3", "gw": "192.168.100.1" },
              { "dst": "64.0.0.0/2", "gw": "192.168.100.1" },
              { "dst": "128.0.0.0/1", "gw": "192.168.100.1" }
            ]
          }
        }
      ]
    }
