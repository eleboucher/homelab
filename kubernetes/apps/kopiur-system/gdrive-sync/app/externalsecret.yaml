---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-sync-secret
    template:
      engineVersion: v2
      data:
        # Same encryption password as the `nas` ClusterRepository (1Password item `kopiur`).
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        RCLONE_CONFIG: /config/rclone/rclone.conf
  dataFrom:
    - extract:
        key: kopiur
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-drive-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: google-drive-backup
    creationPolicy: Owner
  data:
    - secretKey: rclone.conf
      remoteRef:
        key: google-drive
        property: rclone_conf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-ovh
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-ovh-secret
    template:
      engineVersion: v2
      data:
        rclone.conf: |
          [ovh]
          type = s3
          provider = Other
          access_key_id = {{ .AWS_ACCESS_KEY_ID }}
          secret_access_key = {{ .AWS_SECRET_ACCESS_KEY }}
          endpoint = {{ .S3_ENDPOINT }}
          region = rbx
          force_path_style = true
  dataFrom:
    - extract:
        key: ovh-cnpg-backup
