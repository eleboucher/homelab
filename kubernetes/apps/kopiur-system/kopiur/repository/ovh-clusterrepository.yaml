# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: ovh
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-ovh-s3-secret
          namespace: kopiur-system
      bucket: el-homelab-backup
      endpoint: s3.rbx.io.cloud.ovh.net
      prefix: kopiur-s3/
      region: rbx
  concurrency:
    maxConcurrentJobs: 4
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      name: kopiur-ovh-s3-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
  parameters:
    epoch:
      minDuration: 6h
  scheduleDefaults:
    timezone: Europe/Paris
  seed:
    from:
      backend:
        filesystem:
          path: /repo
          volume:
            nfs:
              server: normandie.internal
              path: /backups/kopiur
