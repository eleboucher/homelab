# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    extraVolumes:
      - name: repo
        nfs:
          server: normandie.internal
          path: /backups/kopiur
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    features:
      credentialProjection:
        enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
        # CR metrics belong to the singleton controller, not its replaceable pod.
        # Keep snapshot/policy names and target identity on non-Kopiur metrics.
        metricRelabelings:
          - action: replace
            sourceLabels: [__name__]
            regex: kopiur_.+
            targetLabel: instance
            replacement: kopiur-controller
          - action: replace
            sourceLabels: [__name__]
            regex: kopiur_.+
            targetLabel: pod
            replacement: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
