# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-bunny
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
      verify:
        provider: cosign
        matchOIDCIdentity:
          - issuer: ^https://token\.actions\.githubusercontent\.com$
            subject: ^https://github\.com/bjw-s-labs/helm-charts/
  interval: 1h
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 20000
        runAsGroup: 20000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      cert-manager-webhook-bunny:
        annotations:
          secret.reloader.stakater.com/reload: cert-manager-webhook-bunny-secret
        serviceAccount:
          name: cert-manager-webhook-bunny
        containers:
          app:
            image:
              repository: git.ow-ops.eu/ow-ops/external-dns-bunny-webhook
              tag: main-ef9aac3-1795189553
              digest: sha256:a6599c9a7124dc6651ca0e29475eacb24abd71cdaccc24f4f41049e7a91de8c9
            command:
              - /opt/external-dns-bunny-webhook/cert-manager-webhook
            args:
              - --secure-port=8443
              - --tls-cert-file=/tls/tls.crt
              - --tls-private-key-file=/tls/tls.key
            env:
              GROUP_NAME: bunny.acme.erwanleboucher.dev
            envFrom:
              - secretRef:
                  name: cert-manager-webhook-bunny-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    scheme: HTTPS
                    path: /healthz
                    port: 8443
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      cert-manager-webhook-bunny:
        controller: cert-manager-webhook-bunny
        ports:
          https:
            port: 443
            targetPort: 8443
    rawResources:
      authentication-reader:
        forceRename: cert-manager-webhook-bunny:webhook-authentication-reader
        manifest:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            namespace: kube-system
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: extension-apiserver-authentication-reader
          subjects:
            - kind: ServiceAccount
              name: cert-manager-webhook-bunny
              namespace: cert-manager
    persistence:
      tls:
        type: secret
        name: cert-manager-webhook-bunny-tls
        globalMounts:
          - path: /tls
            readOnly: true
