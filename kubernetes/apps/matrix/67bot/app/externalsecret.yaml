---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 67bot
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: 67bot
    template:
      templateFrom:
        - configMap:
            name: 67bot-configmap
            items:
              - key: config.yaml
      data:
        FORGEJO_TOKEN: "{{ .FORGEJO_TOKEN }}"
  dataFrom:
    - extract:
        key: 67bot
