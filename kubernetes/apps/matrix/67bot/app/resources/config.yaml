database: sqlite:/data/maubot.db
crypto_database: default
crypto_db_pickle_key: |-
  {{ .CRYPTO_PICKLE_KEY }}

plugin_directories:
  upload: /data/plugins
  load:
    - /data/plugins
  trash: /data/trash

plugin_databases:
  sqlite: /data/dbs

server:
  hostname: 0.0.0.0
  port: 29316
  public_url: http://localhost:29316
  override_resource_path: /opt/maubot/frontend
  unshared_secret: |-
    {{ .SERVER_SECRET }}

homeservers:
  erwanleboucher.dev:
    url: http://continuwuity.matrix.svc:8080
    secret: null

admins:
  admin: |-
    {{ .ADMIN_PASSWORD }}

logging:
  version: 1
  formatters:
    normal:
      format: "[%(asctime)s] [%(levelname)s@%(name)s] %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: normal
  root:
    level: INFO
    handlers:
      - console
