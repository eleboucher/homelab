---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: 67bot
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: 67bot
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            app.kubernetes.io/name: 67bot
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: matrix
            app.kubernetes.io/name: continuwuity
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - world
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
