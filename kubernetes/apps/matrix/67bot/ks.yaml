---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app 67bot
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur/hot
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: miroir
      namespace: miroir-system
    - name: continuwuity
    - name: external-secrets
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/matrix/67bot/app
  postBuild:
    substitute:
      APP: *app
      APP_NAMESPACE: matrix
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: matrix
  timeout: 5m
  wait: false
