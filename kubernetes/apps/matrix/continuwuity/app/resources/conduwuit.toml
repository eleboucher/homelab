[global]
server_name = "erwanleboucher.dev"
address = ["::"]
port = 8080

database_path = "/data"
database_backup_path = "/backups"
database_backups_to_keep = 1

rocksdb_compression_algo = "zstd"
rocksdb_compression_level = 32767
rocksdb_bottommost_compression_level = 32767
rocksdb_bottommost_compression = true
rocksdb_direct_io = false

# Temporary: confirm how much timeline history the gapfill path is pulling in.
# Surfaces "Fetched N missing events" from fetch_prevs. Revert once measured.
log = "info,conduwuit_service::rooms::event_handler=debug"

# Perf tuning
cache_capacity_modifier = 2.0
max_request_size = 524288000

# DNS Optimisation
dns_cache_entries = 0
dns_timeout = 60
query_over_tcp_only = true
ip_lookup_strategy = 3

# User settings
allow_encryption = true
allow_federation = true
allow_registration = false
new_user_displayname_suffix = ""
suspend_on_register = false

allow_webpush = true
webpush_vapid_contact = "mailto:erwanleboucher@gmail.com"

url_preview_url_contains_allowlist=["*"]
allow_legacy_media = true
allow_public_room_directory_over_federation = false
lockdown_public_room_directory = true
require_auth_for_profile_requests = true
allow_sticky_events = true
trusted_servers = ["codestorm.net", "starstruck.systems", "unredacted.org"]

admins_list = ["@genesixx:erwanleboucher.dev"]

# Cached remote media has no built-in retention; purge it on every startup so
# the media store does not grow unbounded and fill the volume.
admin_execute = ["media delete-past-remote-media -b 30d"]
admin_execute_errors_ignore = true

registration_token = "{{ .registration_token }}"
emergency_password = "{{ .emergency_password }}"

# Monitor this development build in its dedicated Sentry project.
sentry = true
sentry_endpoint = "https://195b9db009825345c2882604cb19d42e@o911502.ingest.us.sentry.io/4512137797435392"
sentry_send_server_name = false
sentry_traces_sample_rate = 0.15


[global.well_known]
client = "https://matrix.erwanleboucher.dev"
server = "matrix.erwanleboucher.dev:443"
support_mxid = "@genesixx:erwanleboucher.dev"

[global.oauth]
compatibility_mode = "hybrid"

# OIDC disabled: configuring it forces `exclusive` mode, which disables legacy
# password login and only allows native-OAuth clients (Element family).
# Cinny/sable use password login, so OIDC stays off to keep them working.
[global.oauth.oidc]
discovery_url = "https://idm.erwanleboucher.dev/oauth2/openid/continuwuity"
client_id = "continuwuity"
client_secret_file = "/etc/continuwuity/oidc_secret"
additional_scopes = ["email", "openid", "profile"]
prompt_for_localpart = false
profile_key_import_mode = "on_registration"
profile_key_map = { displayname = "name" }

[global.matrix_rtc]
foci = [{ type = "livekit", livekit_service_url = "https://livekit.erwanleboucher.dev" }]
