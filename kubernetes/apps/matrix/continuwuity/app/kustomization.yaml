---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: continuwuity-configmap
    files:
      - ./resources/conduwuit.toml
  - name: continuwuity-dashboard
    files:
      - continuwuity.json=./resources/dashboard.json
  - name: unbound-configmap
    files:
      - unbound.conf=./resources/unbound.conf
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
