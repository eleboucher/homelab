---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mautrix-whatsapp
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1337
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1337
        runAsNonRoot: true
        runAsUser: 1337
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=dock.mau.dev/mautrix/whatsapp
              repository: dock.mau.dev/mautrix/whatsapp
              tag: v0.2611.0@sha256:0f44d561ea591072182ea99bebd463fa8acd0af8400eb3f9c88a90a8cc569805
            args:
              - -c=/data/config.yaml
              - -r=/data/registration.yaml
              - -n
            command:
              - /usr/bin/mautrix-whatsapp
            env:
              MAUTRIX_WHATSAPP_DATABASE__URI:
                valueFrom:
                  secretKeyRef:
                    name: mautrix-whatsapp-postgres
                    key: url
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 29318
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 29318
                  initialDelaySeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
    persistence:
      config:
        type: secret
        name: mautrix-whatsapp
        globalMounts:
          - path: /data/config.yaml
            subPath: config.yaml
            readOnly: true
          - path: /data/registration.yaml
            subPath: registration.yaml
            readOnly: true
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: app
        ports:
          appservice:
            port: 29318
