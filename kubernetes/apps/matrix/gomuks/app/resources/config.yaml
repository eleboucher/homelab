---
# Auth is handled by Envoy Gateway (SecurityPolicy OIDC via Kanidm), so the
# built-in basic auth is disabled. Do not expose this service outside the gateway.
web:
  listen_address: 0.0.0.0:29325
  origin_patterns:
    - "gomuks.erwanleboucher.dev"
  disable_auth_because_i_want_my_account_to_be_hacked: true
