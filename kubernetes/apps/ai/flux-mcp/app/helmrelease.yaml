---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-mcp
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 15m
  values:
    controllers:
      flux-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/name: flux-mcp
            app.kubernetes.io/instance: flux-mcp
          automountServiceAccountToken: true
        replicas: 1
        serviceAccount:
          name: flux-mcp
        containers:
          mcp:
            image:
              repository: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp
              tag: v0.64.0@sha256:b46002c29618df79b708872c9380129481afd17ad1423940cc3b16b81f4282fe
            args:
              - serve
              - --transport=http
              - --port=8000
            env:
              RUNTIME_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      app:
        controller: flux-mcp
        ports:
          http:
            port: 8000
            targetPort: 8000
            protocol: TCP
    serviceAccount:
      flux-mcp: {}
