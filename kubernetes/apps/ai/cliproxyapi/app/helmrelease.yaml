---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cliproxyapi
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 15m
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - kharkiv
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      cliproxyapi:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        containers:
          app:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.1.7@sha256:fd49f56bfcfbfc424709e501f4f8c9ff6e28ff8d8d039eb75d28850201511879
            args:
              - --config
              - /etc/cliproxyapi/config.yaml
              - --local-model
            command:
              - /CLIProxyAPI/CLIProxyAPI
            env:
              HOME: /tmp
              TZ: Europe/Paris
            probes:
              liveness: &healthProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8317
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *healthProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8317
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 24
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    service:
      app:
        controller: cliproxyapi
        ports:
          http:
            port: 8317
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            path: /healthz
        hostnames:
          - cliproxyapi.erwanleboucher.dev
          - litellm.erwanleboucher.dev
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        type: secret
        name: cliproxyapi
        globalMounts:
          - path: /etc/cliproxyapi
            readOnly: true
      logs:
        type: emptyDir
        globalMounts:
          - path: /CLIProxyAPI/logs
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
