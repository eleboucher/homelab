---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi
    creationPolicy: Owner
    template:
      data:
        CLIPROXY_API_KEY: "{{ .CLIPROXY_API_KEY }}"
        config.yaml: |
          config-version: 8
          server:
            host: ""
            port: 8317
          management:
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              - {{ .CLIPROXY_API_KEY | quote }}
          oauth:
            auth-dir: /auth
            model-alias:
              codex:
                - name: gpt-5.6-luna
                  alias: chatgpt/gpt-5.6-luna
                - name: gpt-5.6-terra
                  alias: chatgpt/gpt-5.6-terra
          routing:
            retry:
              request-retry: 3
          requests:
            tls-handshake-timeout-seconds: 20
            payload:
              default:
                - models:
                    - name: gpt-5.6-luna
                      protocol: codex
                  params:
                    reasoning.effort: low
                - models:
                    - name: gpt-5.6-terra
                      protocol: codex
                  params:
                    reasoning.effort: medium
          observability:
            logs:
              debug: false
              request-log: false
              error-logs-max-files: 2
            usage:
              usage-statistics-enabled: false
  data:
    - secretKey: CLIPROXY_API_KEY
      remoteRef:
        key: litellm
        property: LITELLM_MASTER_KEY
