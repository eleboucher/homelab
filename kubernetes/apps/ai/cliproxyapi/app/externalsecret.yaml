---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi
    creationPolicy: Owner
    template:
      data:
        CLIPROXY_API_KEY: "{{ .CLIPROXY_API_KEY }}"
        config.yaml: |
          config-version: 8
          server:
            host: ""
            port: 8317
          management:
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              - {{ .CLIPROXY_API_KEY | quote }}
          oauth:
            auth-dir: /auth
          upstream:
            claude:
              # Pass client system prompts through; no Claude Code disguise
              disable-claude-cloak-mode: true
          api-keys:
            claude:
              - name: anthropic
                models:
                  - name: claude-opus-5-5
                    alias: claude/opus-low
                  - name: claude-opus-5-5
                    alias: claude/opus-medium
                  - name: claude-haiku-5-5
                    alias: claude/haiku
                keys:
                  - api-key: {{ .ANTHROPIC_API_KEY | quote }}
                    cloak:
                      mode: never
          routing:
            retry:
              request-retry: 3
          requests:
            tls-handshake-timeout-seconds: 20
            payload:
              default:
                - models:
                    - name: claude/opus-low
                      protocol: claude
                  params:
                    output_config.effort: low
                - models:
                    - name: claude/opus-medium
                      protocol: claude
                  params:
                    output_config.effort: medium
          observability:
            logs:
              debug: false
              request-log: false
              error-logs-max-files: 2
            usage:
              usage-statistics-enabled: false
  data:
    - secretKey: CLIPROXY_API_KEY
      remoteRef:
        key: litellm
        property: LITELLM_MASTER_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: anthropic
        property: ANTHROPIC_API_KEY
