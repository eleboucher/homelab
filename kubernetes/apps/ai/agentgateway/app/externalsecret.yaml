---
# Session key: agentgateway wants 64 hex chars (an AES-256 key); 32 random chars hex-encoded give that.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentgateway-session-key
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
  encoding: hex
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway
spec:
  refreshInterval: "0"
  target:
    name: agentgateway
    template:
      data:
        key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentgateway-session-key
---
# Client key Hermes presents to the MCP gateway; Hermes mounts the same secret.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-hermes
spec:
  refreshInterval: "0"
  target:
    name: agentgateway-hermes
    template:
      data:
        HERMES_API_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw
