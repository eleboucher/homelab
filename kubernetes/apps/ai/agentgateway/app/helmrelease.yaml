            apiKey:
              mode: strict
              keys:
                - key: ${HERMES_API_KEY}
                  metadata:
                    client: hermes
            mcpAuthorization:
              rules:
                - allow: apiKey.client == "hermes"
        - name: mcp-ferryhopper
          gateways:
            - mcp
          matches:
            - path:
