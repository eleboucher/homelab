            mcpAuthorization:
              rules:
                - allow: apiKey.client == "hermes"
        - name: mcp-trivago
          gateways:
            - mcp
          matches:
            - path:
                pathPrefix: /mcp/trivago
          backends:
            - mcp:
                targets:
                  - name: trivago
                    mcp:
                      host: https://mcp.trivago.com/mcp
          policies:
            urlRewrite:
              path:
