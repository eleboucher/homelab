---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-network-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-network-mcp
  interval: 15m
  values:
    controllers:
      unifi-network-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/name: unifi-network-mcp
            app.kubernetes.io/instance: unifi-network-mcp
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
        replicas: 1
        containers:
          mcp:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.50.3@sha256:33ceb50cf878b80250d56f259ea73b08de54e689a217a0ae780c7c1441fd02a2
            env:
              UNIFI_MCP_ALLOWED_HOSTS:
                value: unifi-network-mcp.ai.svc.cluster.local,unifi-network-mcp,localhost,127.0.0.1
              UNIFI_MCP_HOST:
                value: 0.0.0.0
              UNIFI_MCP_HTTP_ENABLED:
                value: "true"
              UNIFI_MCP_PORT:
                value: "3000"
              UNIFI_NETWORK_HOST:
                value: 192.168.1.1
              UNIFI_NETWORK_VERIFY_SSL:
                value: "false"
            envFrom:
              - secretRef:
                  name: unifi-network-mcp
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: unifi-network-mcp
        ports:
          http:
            port: 3000
            targetPort: 3000
            protocol: TCP
