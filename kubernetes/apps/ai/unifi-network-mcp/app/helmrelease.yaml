---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-network-mcp
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 15m
  values:
    controllers:
      unifi-network-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            app.kubernetes.io/name: unifi-network-mcp
            app.kubernetes.io/instance: unifi-network-mcp
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
        replicas: 1
        containers:
          mcp:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.53.0@sha256:84c4221880d97d05a989b341a6f733d17f001a0451a049f03587855ff59e5787
            env:
              UNIFI_MCP_ALLOWED_HOSTS:
                value: unifi-network-mcp.ai.svc.cluster.local,unifi-network-mcp,localhost,127.0.0.1
              UNIFI_MCP_HOST:
                value: 0.0.0.0
              UNIFI_MCP_HTTP_ENABLED:
                value: "true"
              UNIFI_MCP_PORT:
                value: "3000"
              UNIFI_NETWORK_HOST:
                value: 192.168.1.1
              UNIFI_NETWORK_VERIFY_SSL:
                value: "false"
            envFrom:
              - secretRef:
                  name: unifi-network-mcp
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: unifi-network-mcp
        ports:
          http:
            port: 3000
            targetPort: 3000
            protocol: TCP
