---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-network-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-network-mcp
    creationPolicy: Owner
  data:
    # API key only: reads inventory; writes need a local UniFi user (UNIFI_NETWORK_USERNAME/PASSWORD).
    - secretKey: UNIFI_NETWORK_API_KEY
      remoteRef:
        key: unifi-tofu
        property: api_key
