# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minimax-shim
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 15m
  values:
    controllers:
      minimax-shim:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/minimax-shim
              tag: 0.0.1
            env:
              ADDR: ":8080"
              PUBLIC_URL: https://shim.erwanleboucher.dev
              MEDIA_DIR: /data/minimax-media
              VIDEO_TIMEOUT: 20m
            envFrom:
              - secretRef:
                  name: minimax-shim
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: minimax-shim
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - shim.erwanleboucher.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      media:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: miroir-local
        globalMounts:
          - path: /data/minimax-media
