---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.101.0-rc.2@sha256:8168e6918f40c00b735ecf1d34afe966424f61a2f17aa1fe159827acdaa6036e
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600
  litellmSettings:
    callbacks:
      - /opt/litellm-compat/chatgpt_stream_recovery.proxy_handler_instance
    success_callback: ["prometheus"]
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
    drop_params: true
    merge_reasoning_content_in_choices: true
    set_verbose: false
  env:
    - name: CHATGPT_TOKEN_DIR
      value: /app/chatgpt_tokens
    - name: LITELLM_LOG
      value: INFO
    - name: REDIS_HOST
      value: dragonfly.database.svc
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
  volumes:
    - configMap:
        name: litellm-chatgpt-compat
      name: chatgpt-compat
    - name: chatgpt-tokens
      persistentVolumeClaim:
        claimName: litellm-chatgpt
  volumeMounts:
    - mountPath: /opt/litellm-compat
      name: chatgpt-compat
      readOnly: true
    - name: chatgpt-tokens
      mountPath: /app/chatgpt_tokens
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - litellm.erwanleboucher.dev
    parentRefs:
      - name: envoy-external
        namespace: network
