apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-configmap
data:
  config.yaml: |-
    custom_providers:
      - name: litellm
        base_url: http://litellm.ai:4000/v1
        key_env: LITELLM_API_KEY
        models:
          chatgpt/gpt-5.6-luna:
            context_length: 272000
          chatgpt/gpt-5.6-terra:
            context_length: 272000
    model:
      default: chatgpt/gpt-5.6-luna
      provider: custom:litellm
      context_length: 272000
    model_aliases:
      luna:
        model: chatgpt/gpt-5.6-luna
        provider: custom:litellm
      terra:
        model: chatgpt/gpt-5.6-terra
        provider: custom:litellm
    auxiliary:
      approval:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
        timeout: 60
      compression:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      web_extract:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      session_search:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      vision:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      goal_judge:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      title_generation:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      profile_describer:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      triage_specifier:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      kanban_decomposer:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
      curator:
        provider: custom:litellm
        model: chatgpt/gpt-5.6-luna
        timeout: 600
    memory:
      provider: memini
    plugins:
      enabled:
        - memini
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 900
      lifetime_seconds: 1800
      persistent_shell: true
    timeouts:
      tools:
        # Match terminal.timeout — the 420s default preempted the
        # commit-watcher fetcher mid-run and forced a full re-fetch.
        concurrent_batch: 900
    compression:
      enabled: true
      protect_last_n: 20
      threshold: 0.5
    streaming:
      enabled: false
    approvals:
      mode: smart
      timeout: 60
      cron_mode: deny
    security:
      redact_secrets: true
      website_blocklist:
        enabled: true
        domains:
          - "169.254.169.254"
          - "metadata.google.internal"
    privacy:
      redact_pii: true
    agent:
      max_turns: 150
      gateway_timeout: 1800
      gateway_timeout_warning: 900
      restart_drain_timeout: 60
      api_max_retries: 3
      reasoning_effort: medium
    delegation:
      model: chatgpt/gpt-5.6-luna
      max_concurrent_children: 8
      max_spawn_depth: 2
    moa:
      default_preset: council
      presets:
        council:
          enabled: true
          reference_models:
            - provider: custom:litellm
              model: chatgpt/gpt-5.6-luna
            - provider: custom:litellm
              model: chatgpt/gpt-5.6-terra
          aggregator:
            provider: custom:litellm
            model: chatgpt/gpt-5.6-terra
          max_tokens: 8192
    platforms:
      matrix:
        enabled: false
    matrix:
      require_mention: false
      auto_thread: false
      dm_mention_threads: false
    display:
      platforms:
        matrix:
          tool_progress: "off"
    mcp_servers:
      homelab:
        url: http://litellm.ai:4000/mcp
        headers:
          Authorization: "Bearer $${LITELLM_API_KEY}"
    web:
      search_backend: searxng
  env: |-
    LITELLM_API_KEY={{ .LITELLM_MASTER_KEY }}
    OPENAI_API_KEY={{ .LITELLM_MASTER_KEY }}
    OPENAI_BASE_URL=http://litellm.ai:4000/v1
    SUMMARY_LLM_API_KEY={{ .LITELLM_MASTER_KEY }}
    API_SERVER_KEY={{ .API_SERVER_KEY }}
    GATEWAY_ALLOWED_USERS={{ .GATEWAY_ALLOWED_USERS }}
