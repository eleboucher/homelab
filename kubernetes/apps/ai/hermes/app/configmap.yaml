apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-configmap
data:
  config.yaml: |-
    _config_version: 54
    providers:
      litellm:
        api: http://cliproxyapi.ai:8317/v1
        name: litellm
        key_env: CLIPROXY_API_KEY
        models:
          claude/opus-low:
            context_length: 272000
          claude/opus-medium:
            context_length: 272000
          claude/opus-high:
            context_length: 272000
          claude/sonnet: {}
          claude/haiku: {}
          claude/fable: {}
    model:
      default: claude/opus-low
      provider: custom:litellm
      context_length: 272000
    model_aliases:
      opus-low:
        model: claude/opus-low
        provider: custom:litellm
      opus:
        model: claude/opus-medium
        provider: custom:litellm
      opus-high:
        model: claude/opus-high
        provider: custom:litellm
      sonnet:
        model: claude/sonnet
        provider: custom:litellm
      haiku:
        model: claude/haiku
        provider: custom:litellm
      fable:
        model: claude/fable
        provider: custom:litellm
    auxiliary:
      approval:
        provider: custom:litellm
        model: claude/opus-low
        timeout: 60
      compression:
        provider: custom:litellm
        model: claude/opus-low
      web_extract:
        provider: custom:litellm
        model: claude/opus-low
      session_search:
        provider: custom:litellm
        model: claude/opus-low
      vision:
        provider: custom:litellm
        model: claude/opus-low
      goal_judge:
        provider: custom:litellm
        model: claude/opus-low
      title_generation:
        provider: custom:litellm
        model: claude/opus-low
      profile_describer:
        provider: custom:litellm
        model: claude/opus-low
      triage_specifier:
        provider: custom:litellm
        model: claude/opus-low
      kanban_decomposer:
        provider: custom:litellm
        model: claude/opus-low
      curator:
        provider: custom:litellm
        model: claude/opus-low
        timeout: 600
    memory:
      provider: memini
    plugins:
      enabled:
        - memini
        - advanced-delegation
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 900
      lifetime_seconds: 1800
      persistent_shell: true
    timeouts:
      tools:
        # Match terminal.timeout — the 420s default preempted the
        # commit-watcher fetcher mid-run and forced a full re-fetch.
        concurrent_batch: 900
    compression:
      enabled: true
      protect_last_n: 20
      threshold: 0.5
    streaming:
      enabled: false
    approvals:
      mode: smart
      timeout: 60
      cron_mode: deny
    security:
      redact_secrets: true
      website_blocklist:
        enabled: true
        domains:
          - "169.254.169.254"
          - "metadata.google.internal"
    privacy:
      redact_pii: true
    agent:
      max_turns: 150
      gateway_timeout: 1800
      gateway_timeout_warning: 900
      restart_drain_timeout: 60
      api_max_retries: 3
      reasoning_effort: medium
    # Replaces openclaw's explorer/fixer/oracle roles: the model picks a route per task.
    # Second opinions use the built-in /review command.
    delegation:
      max_concurrent_children: 8
      max_spawn_depth: 2
      backend: model_map
      backends:
        model_map:
          options:
            - name: quick
              description: Cheapest; trivial lookups, summaries and simple searches.
              provider: custom:litellm
              model: claude/haiku
            - name: fast
              description: Default worker; scoped implementation, edits and codebase recon.
              provider: custom:litellm
              model: claude/opus-low
            - name: deep
              description: Hard debugging, root cause and architecture; strongest reasoning.
              provider: custom:litellm
              model: claude/opus-high
          default: fast
    moa:
      default_preset: council
      presets:
        council:
          enabled: true
          reference_models:
            - provider: custom:litellm
              model: claude/opus-low
            - provider: custom:litellm
              model: claude/opus-medium
          aggregator:
            provider: custom:litellm
            model: claude/opus-medium
          max_tokens: 8192
    platforms:
      matrix:
        enabled: false
    matrix:
      require_mention: false
      auto_thread: false
      dm_mention_threads: false
    display:
      platforms:
        matrix:
          tool_progress: "off"
    # Remote MCP servers go through agentgateway (one key, per-route auth); see kubernetes/apps/ai/agentgateway.
    mcp_servers:
      context7:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/context7
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      flux:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/flux
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      kubectl:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/kubectl
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      kubesearch:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/kubesearch
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      home-assistant:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/home-assistant
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      unifi-network:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/unifi-network
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      skiplagged:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/skiplagged
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      kiwi:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/kiwi
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      trivago:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/trivago
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      ferryhopper:
        url: http://agentgateway.ai.svc.cluster.local:8081/mcp/ferryhopper
        headers:
          Authorization: "Bearer $${AGENTGATEWAY_API_KEY}"
      airbnb:
        command: npx
        args:
          - -y
          - "@openbnb/mcp-server-airbnb@latest"
          - --ignore-robots-txt
    web:
      search_backend: searxng
  env: |-
    CLIPROXY_API_KEY={{ .CLIPROXY_API_KEY }}
    LITELLM_API_KEY={{ .CLIPROXY_API_KEY }}
    CONTEXT7_API_KEY={{ .CONTEXT7_API_KEY }}
    OPENAI_API_KEY={{ .CLIPROXY_API_KEY }}
    OPENAI_BASE_URL=http://cliproxyapi.ai:8317/v1
    SUMMARY_LLM_API_KEY={{ .CLIPROXY_API_KEY }}
    API_SERVER_KEY={{ .API_SERVER_KEY }}
    GATEWAY_ALLOWED_USERS={{ .GATEWAY_ALLOWED_USERS }}
