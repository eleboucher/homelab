apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-configmap
data:
  config.yaml: |-
    custom_providers:
      - name: litellm
        base_url: http://cliproxyapi.ai:8317/v1
        key_env: CLIPROXY_API_KEY
        models:
          claude/opus-low:
            context_length: 272000
          claude/opus-medium:
            context_length: 272000
    model:
      default: claude/opus-low
      provider: custom:litellm
      context_length: 272000
    model_aliases:
      opus-low:
        model: claude/opus-low
        provider: custom:litellm
      opus:
        model: claude/opus-medium
        provider: custom:litellm
    auxiliary:
      approval:
        provider: custom:litellm
        model: claude/opus-low
        timeout: 60
      compression:
        provider: custom:litellm
        model: claude/opus-low
      web_extract:
        provider: custom:litellm
        model: claude/opus-low
      session_search:
        provider: custom:litellm
        model: claude/opus-low
      vision:
        provider: custom:litellm
        model: claude/opus-low
      goal_judge:
        provider: custom:litellm
        model: claude/opus-low
      title_generation:
        provider: custom:litellm
        model: claude/opus-low
      profile_describer:
        provider: custom:litellm
        model: claude/opus-low
      triage_specifier:
        provider: custom:litellm
        model: claude/opus-low
      kanban_decomposer:
        provider: custom:litellm
        model: claude/opus-low
      curator:
        provider: custom:litellm
        model: claude/opus-low
        timeout: 600
    memory:
      provider: memini
    plugins:
      enabled:
        - memini
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 900
      lifetime_seconds: 1800
      persistent_shell: true
    timeouts:
      tools:
        # Match terminal.timeout — the 420s default preempted the
        # commit-watcher fetcher mid-run and forced a full re-fetch.
        concurrent_batch: 900
    compression:
      enabled: true
      protect_last_n: 20
      threshold: 0.5
    streaming:
      enabled: false
    approvals:
      mode: smart
      timeout: 60
      cron_mode: deny
    security:
      redact_secrets: true
      website_blocklist:
        enabled: true
        domains:
          - "169.254.169.254"
          - "metadata.google.internal"
    privacy:
      redact_pii: true
    agent:
      max_turns: 150
      gateway_timeout: 1800
      gateway_timeout_warning: 900
      restart_drain_timeout: 60
      api_max_retries: 3
      reasoning_effort: medium
    delegation:
      model: claude/opus-low
      max_concurrent_children: 8
      max_spawn_depth: 2
    moa:
      default_preset: council
      presets:
        council:
          enabled: true
          reference_models:
            - provider: custom:litellm
              model: claude/opus-low
            - provider: custom:litellm
              model: claude/opus-medium
          aggregator:
            provider: custom:litellm
            model: claude/opus-medium
          max_tokens: 8192
    platforms:
      matrix:
        enabled: false
    matrix:
      require_mention: false
      auto_thread: false
      dm_mention_threads: false
    display:
      platforms:
        matrix:
          tool_progress: "off"
    mcp_servers:
      context7:
        url: https://mcp.context7.com/mcp
        headers:
          Authorization: "Bearer $${CONTEXT7_API_KEY}"
    web:
      search_backend: searxng
  env: |-
    CLIPROXY_API_KEY={{ .CLIPROXY_API_KEY }}
    LITELLM_API_KEY={{ .CLIPROXY_API_KEY }}
    CONTEXT7_API_KEY={{ .CONTEXT7_API_KEY }}
    OPENAI_API_KEY={{ .CLIPROXY_API_KEY }}
    OPENAI_BASE_URL=http://cliproxyapi.ai:8317/v1
    SUMMARY_LLM_API_KEY={{ .CLIPROXY_API_KEY }}
    API_SERVER_KEY={{ .API_SERVER_KEY }}
    GATEWAY_ALLOWED_USERS={{ .GATEWAY_ALLOWED_USERS }}
