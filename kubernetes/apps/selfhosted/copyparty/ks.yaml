---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: copyparty
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: copyparty
  components:
    - ../../../../components/kopiur/hot
    - ../../../../components/kopiur/snapshot-restore
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: kopiur-repository
      namespace: kopiur-system
    - name: miroir
      namespace: miroir-system
  interval: 1h
  path: "./kubernetes/apps/selfhosted/copyparty/app"
  postBuild:
    substitute:
      APP: copyparty
      APP_NAMESPACE: selfhosted
      KOPIUR_CAPACITY: 20Gi
      KOPIUR_RESTORE_NAME: copyparty-local-restore
      KOPIUR_RESTORE_SNAPSHOT: copyparty-pre-local-migration-20260812092624
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
