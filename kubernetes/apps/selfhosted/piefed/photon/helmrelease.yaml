---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photon
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      photon:
        containers:
          app:
            image:
              repository: ghcr.io/xyphyn/photon
              tag: v2.4.3@sha256:141a467315ef061fdac06ca4cb484f1014cea2a2651061ba4ecec2a62fc98d7e
            env:
              HOST: "::"
              PUBLIC_INSTANCE_URL: piefed.erwanleboucher.dev
              PUBLIC_INSTANCE_TYPE: piefedalpha
              PUBLIC_SSR_ENABLED: false
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 56Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    route:
      app:
        parentRefs:
          - name: envoy-external
            namespace: network
        hostnames:
          - photon.erwanleboucher.dev
    service:
      app:
        controller: photon
        ports:
          http:
            port: 3000
