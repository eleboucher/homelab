---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ticketbooth
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ticketbooth
    namespace: selfhosted
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/bo0tzz/ticketbooth
              tag: "sha-1cc95c0@sha256:107f53f2cc163ca6506aadcfa724dc83c2ce12b5efa20ae7e86edffdc046c2f8"
            env:
              TZ: Europe/Amsterdam
              TARGET_URL: https://tickets.events.ccc.de/40c3/
              TARGET_TIME: "2026-11-11T18:00:00+01:00"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    persistence:
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
    route:
      main:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - ticketbooth.erwanleboucher.dev
        rules:
          - backendRefs:
              - identifier: main
                port: 8080
