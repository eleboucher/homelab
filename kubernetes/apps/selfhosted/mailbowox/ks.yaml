---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mailbowox
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: mailbowox
  components:
    - ../../../../components/kopiur/hot
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: external-secrets
      namespace: security
    - name: kopiur-repository
      namespace: kopiur-system
    - name: miroir
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/selfhosted/mailbowox/app
  postBuild:
    substitute:
      APP: mailbowox
      APP_NAMESPACE: selfhosted
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_MOVER_GID: "65534"
      KOPIUR_MOVER_UID: "65534"
      KOPIUR_PGID: "65534"
      KOPIUR_PUID: "65534"
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
