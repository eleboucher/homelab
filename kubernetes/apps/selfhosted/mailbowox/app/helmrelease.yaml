---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailbowox
spec:
  chartRef:
    kind: OCIRepository
    name: mailbowox
  interval: 30m
  values:
    controllers:
      gateway:
        pod:
          securityContext:
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: git.ow-ops.eu/ow-ops/mailbowox-gateway
              tag: main-405b7ca-1795268071
              digest: sha256:3005a0d546a352eeba430ffa98944059218d8cb718357c1ceda333d850a9b13e
            env:
              ALLOWED_ORIGINS: https://mailbowox.erwanleboucher.dev
              APNS_KEY_FILE: /secrets/apns/key.p8
              APNS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: mailbowox-secret
                    key: APNS_KEY_ID
              APNS_TEAM_ID: NXLJ6G3CP7
              BIND: "[::]:8080"
              GATEWAY_TOKENS:
                valueFrom:
                  secretKeyRef:
                    name: mailbowox-secret
                    key: GATEWAY_TOKENS
              PUSH_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: mailbowox-secret
                    key: PUSH_SECRET_KEY
              TRUST_PROXY: "1"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 0
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      web:
        pod:
          securityContext:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
        containers:
          app:
            image:
              repository: git.ow-ops.eu/ow-ops/mailbowox-web
              tag: main-405b7ca-1795268071
              digest: sha256:766035335811893923a2cee513fbc01dd44e0fd61a9fd9a027ed95549b1444ff
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      apns:
        type: secret
        defaultMode: 0440
        items:
          - key: key.p8
            path: key.p8
        name: mailbowox-secret
        advancedMounts:
          gateway:
            app:
              - path: /secrets/apns
                readOnly: true
      data:
        type: persistentVolumeClaim
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          gateway:
            app:
              - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          web:
            app:
              - path: /tmp
    route:
      gateway:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 404"]
        hostnames:
          - mailbowox-gateway.erwanleboucher.dev
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: gateway
                port: *port
      web:
        hostnames:
          - mailbowox.erwanleboucher.dev
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: web
                port: *port
    service:
      gateway:
        controller: gateway
        ports:
          http:
            port: *port
      web:
        controller: web
        ports:
          http:
            port: *port
