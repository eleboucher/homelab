---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      trek:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=mauriceboe/trek
              repository: mauriceboe/trek
              tag: 5.2.1
            env:
              ALLOWED_ORIGINS: https://travel.erwanleboucher.dev
              APP_URL: https://travel.erwanleboucher.dev
              FORCE_HTTPS: "true"
              NODE_ENV: production
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    key: client-id
                    name: kanidm-trek-oidc
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    key: client-secret
                    name: kanidm-trek-oidc
              OIDC_DISCOVERY_URL: https://idm.erwanleboucher.dev/oauth2/openid/trek/.well-known/openid-configuration
              OIDC_DISPLAY_NAME: Kanidm
              OIDC_ISSUER: https://idm.erwanleboucher.dev/oauth2/openid/trek
              OIDC_ONLY: "true"
              OIDC_SCOPE: openid email profile groups
              PORT: "3000"
              TRUST_PROXY: "1"
              TZ: Europe/Paris
            envFrom:
              - secretRef:
                  name: trek-secret
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api/health
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api/health
                    port: 3000
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                memory: 384Mi
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: miroir-local
        globalMounts:
          - path: /app/data
      uploads:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: miroir-local
        globalMounts:
          - path: /app/uploads
    route:
      app:
        hostnames:
          - travel.erwanleboucher.dev
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        controller: trek
        ports:
          http:
            port: 3000
