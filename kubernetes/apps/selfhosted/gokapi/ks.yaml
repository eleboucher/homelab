---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gokapi
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: gokapi
  components:
    - ../../../../components/kopiur/hot
    - ../../../../components/oidc
  dependsOn:
    - name: envoy-gateway
      namespace: network
    - name: garage
      namespace: garage-system
    - name: kanidm
      namespace: security
    - name: kopiur-repository
      namespace: kopiur-system
    - name: miroir
      namespace: miroir-system
  interval: 1h
  path: "./kubernetes/apps/selfhosted/gokapi/app"
  postBuild:
    substitute:
      APP: gokapi
      APP_NAMESPACE: selfhosted
      KOPIUR_CAPACITY: 2Gi
      OIDC_CALLBACK: /oauth-callback
      OIDC_DISABLE_PKCE: "true"
      OIDC_DISPLAY_NAME: "Gokapi"
      OIDC_GROUP: admins
      SUBDOMAIN: share
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 5m
  wait: false
