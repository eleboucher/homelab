---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gokapi
spec:
  chartRef:
    kind: OCIRepository
    name: gokapi
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      gokapi:
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/f0rc3/gokapi
              tag: v2.2.4
            env:
              TZ: "Europe/Paris"
              GOKAPI_AWS_BUCKET: gokapi
              GOKAPI_AWS_ENDPOINT: "http://garage.garage-system.svc.cluster.local:3900"
              GOKAPI_AWS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gokapi-s3
                    key: access-key-id
              GOKAPI_AWS_KEY_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: gokapi-s3
                    key: secret-access-key
              # Garage is cluster-internal, so pre-signed URLs are unreachable
              # from a browser: Gokapi has to stream downloads itself.
              GOKAPI_AWS_PROXY_DOWNLOAD: "true"
              GOKAPI_AWS_REGION: us-east-1
              GOKAPI_CONFIG_DIR: /app/config
              GOKAPI_DATA_DIR: /app/data
              GOKAPI_LOG_STDOUT: "true"
              GOKAPI_MAX_FILESIZE: "10240"
              GOKAPI_PORT: "53842"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: gokapi
        globalMounts:
          - path: /app/config
            subPath: config
          - path: /app/data
            subPath: data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

    route:
      app:
        hostnames:
          - share.erwanleboucher.dev
        parentRefs:
          - name: envoy-external
            namespace: network

    service:
      app:
        controller: gokapi
        ports:
          http:
            port: 53842
