---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: phanpy
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 30m
  values:
    controllers:
      phanpy:
        containers:
          main:
            image:
              repository: "ghcr.io/jjgadgets/phanpy"
              tag: 2026.10.09.febb38d
            env:
              PHANPY_WEBSITE: "phanpy.erwanleboucher.dev"
              PHANPY_DEFAULT_INSTANCE: "gts.erwanleboucher.dev"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 32Mi
    service:
      main:
        controller: phanpy
        ports:
          http:
            port: 8080
    route:
      app:
        parentRefs:
          - name: envoy-external
            namespace: network
        hostnames:
          - phanpy.erwanleboucher.dev
