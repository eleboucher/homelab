---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zipline
spec:
  chartRef:
    kind: OCIRepository
    name: zipline
  interval: 30m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    controllers:
      zipline:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/diced/zipline
              tag: 4.6.5
            env:
              TZ: "Europe/Paris"
              CORE_DEFAULT_DOMAIN: share.erwanleboucher.dev
              CORE_PORT: &port 3000
              CORE_RETURN_HTTPS_URLS: "true"
              CORE_TEMP_DIRECTORY: /tmp/zipline
              CORE_TRUST_PROXY: "true"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: zipline-postgres
                    key: url
              DATASOURCE_S3_ACCESS_KEY_ID:
                valueFrom:
                  secretKeyRef:
                    name: zipline-s3
                    key: access-key-id
              DATASOURCE_S3_BUCKET: zipline
              DATASOURCE_S3_ENDPOINT: "http://garage.garage-system.svc.cluster.local:3900"
              DATASOURCE_S3_FORCE_PATH_STYLE: "true"
              DATASOURCE_S3_REGION: us-east-1
              DATASOURCE_S3_SECRET_ACCESS_KEY:
                valueFrom:
                  secretKeyRef:
                    name: zipline-s3
                    key: secret-access-key
              DATASOURCE_TYPE: s3
              FEATURES_OAUTH_REGISTRATION: "true"
              FEATURES_USER_REGISTRATION: "false"
              FILES_DEFAULT_EXPIRATION: 7d
              FILES_MAX_FILE_SIZE: 10gb
              OAUTH_LOGIN_ONLY: "true"
              OAUTH_OIDC_AUTHORIZE_URL: https://idm.erwanleboucher.dev/ui/oauth2
              OAUTH_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-zipline-oidc
                    key: client-id
              OAUTH_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-zipline-oidc
                    key: client-secret
              OAUTH_OIDC_REDIRECT_URI: https://share.erwanleboucher.dev/api/auth/oauth/oidc
              OAUTH_OIDC_TOKEN_URL: https://idm.erwanleboucher.dev/oauth2/token
              OAUTH_OIDC_USERINFO_URL: https://idm.erwanleboucher.dev/oauth2/openid/zipline/userinfo
            envFrom:
              - secretRef:
                  name: zipline-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: *port
                  failureThreshold: 3
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      uploads:
        type: emptyDir
        globalMounts:
          - path: /zipline/uploads

    route:
      app:
        hostnames:
          - share.erwanleboucher.dev
        parentRefs:
          - name: envoy-external
            namespace: network

    service:
      app:
        controller: zipline
        ports:
          http:
            port: *port
