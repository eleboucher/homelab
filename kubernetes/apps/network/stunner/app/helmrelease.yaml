---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stunner
spec:
  chart:
    spec:
      chart: stunner
      sourceRef:
        kind: HelmRepository
        name: stunner
      version: 2.0.2
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: stunner-gateway-operator-controller-manager
            patch: |
              - op: replace
                path: /metadata/name
                value: stunner-operator
              - op: add
                path: /spec/strategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 0
                    maxUnavailable: 1
  values:
    standardCrds:
      enabled: false
    stunnerAuthService:
      enabled: false
    stunnerGatewayOperator:
      dataplane:
        spec:
          enableMetricsEndpoint: true
