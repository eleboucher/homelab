---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-bouncer
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  interval: 1h
  values:
    config:
      bouncer:
        apiKeySecretRef:
          name: crowdsec-secret
          key: BOUNCER_KEY_ENVOY
        lapiURL: http://crowdsec-service:8080
        metrics: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      trustedProxies:
        - 10.42.0.0/16
        - fd42::/56
    fullnameOverride: *app
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      capabilities:
        drop:
          - ALL
