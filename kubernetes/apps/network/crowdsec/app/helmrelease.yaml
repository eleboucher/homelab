---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  chartRef:
    kind: OCIRepository
    name: crowdsec
  interval: 1h
  install:
    disableSchemaValidation: true # the chart schema rejects the kubernetes acquisition source
  upgrade:
    disableSchemaValidation: true
  values:
    agent:
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      hostVarLog: false
      isDeployment: true
      metrics:
        serviceMonitor:
          enabled: true
      serviceAccountName: crowdsec-agent
    config:
      # Behavioural scenarios only alert: matrix, s3 and git clients look like crawlers.
      # Signature scenarios (sensitive files, path traversal, CVEs, admin probing) still ban.
      simulation.yaml: |
        simulation: false
        exclusions:
          - crowdsecurity/http-crawl-non_statics
          - crowdsecurity/http-probing
    container_runtime: containerd # the default (docker) mounts /var/lib/docker/containers into the agent
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    lapi:
      env:
        - name: USE_WAL
          value: "true"
      envFrom:
        - secretRef:
            name: &secret crowdsec-secret
      metrics:
        serviceMonitor:
          enabled: true
      persistentVolume:
        config:
          storageClassName: miroir-local
        data:
          storageClassName: miroir-local
      podAnnotations:
        secret.reloader.stakater.com/reload: *secret
