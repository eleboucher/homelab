---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: ddr-opt-out
spec:
  endpoints:
    # Hides the gateway's encrypted upstream from DDR so clients keep using it for local names.
    - dnsName: _dns.resolver.arpa
      recordType: CNAME
      targets:
        - unifi.erwanleboucher.dev
