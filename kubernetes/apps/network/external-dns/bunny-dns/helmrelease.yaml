---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bunny-dns
spec:
  chartRef:
    kind: OCIRepository
    name: bunny-dns
  interval: 1h
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          repository: git.ow-ops.eu/ow-ops/external-dns-bunny-webhook
          tag: main-ef9aac3-1795189553
          digest: sha256:a6599c9a7124dc6651ca0e29475eacb24abd71cdaccc24f4f41049e7a91de8c9
        env:
          - name: BUNNY_API_KEY
            valueFrom:
              secretKeyRef:
                name: &secret external-dns-bunny-secret
                key: BUNNY_API_KEY
    extraArgs:
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=envoy-external
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - crd
      - gateway-httproute
    txtOwnerId: default
    txtPrefix: "k8s-%{record_type}."
    domainFilters:
      - erwanleboucher.dev
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
