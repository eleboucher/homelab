---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.pull_request.number || forgejo.ref }}${{ forgejo.event.action == 'labeled' && format('-label-{0}', forgejo.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    if: ${{ !forgejo.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ forgejo.event.pull_request.head.sha }}

      - name: Install gh CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y gh

      - name: AI PR Review
        uses: https://github.com/misospace/pr-reviewer-action@768a1320d67f14b99737633a5f8ba58449c3caeb # v3.4.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          platform: forgejo
          forgejo-api-url: https://git.erwanleboucher.dev/
          forgejo-token: ${{ secrets.GITHUB_TOKEN }}
          allowed-source-hosts: github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,git.erwanleboucher.dev,codeberg.org
          ai-base-url: https://litellm.erwanleboucher.dev/v1
          ai-api-format: anthropic
          ai-model: MiniMax-M3
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-max-tokens: "16000"
          ai-primary-retries: "2"
          ai-primary-retry-delay-sec: "5"
          ai-connect-timeout-sec: "10"
          ai-fallback-base-url: https://litellm.erwanleboucher.dev/v1
          ai-fallback-api-format: openai
          ai-fallback-model: neuralwatt-qwen3-6-35b
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          on-model-failure: notice
          tool-mode: native_loop
          tool-max-requests: "4"
          tool-max-rounds: "2"
          tool-loop-wall-clock-sec: "180"
          tool-request-timeout-sec: "15"
          tool-max-response-bytes: "12000"
          tool-turn-timeout-sec: "60"
          tool-corpus-max-bytes: "30000"
          tool-max-tokens-per-turn: "8000"
          tool-allowed-gh-api-repos: "eleboucher/homelab"
          tool-enable-for-forks: "false"
          tool-mcp-servers: "tools=https://litellm.erwanleboucher.dev/mcp,konflate=https://konflate.erwanleboucher.dev/mcp"
          tool-mcp-token: ${{ secrets.LITELLM_API_KEY }}
          tool-mcp-name-prefixes: "github,talos_mcp,searxng,ha_mcp,grafana,victoria_logs,context7,sidero"
          publish-review-comment: "true"
