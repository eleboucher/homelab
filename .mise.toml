
[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
JUST_UNSTABLE = "1"

[tools]
"python" = "latest"
"uv" = "latest"
"github:mitsuhiko/minijinja" = "2.24.0"
"github:siderolabs/talos" = "v1.14.1"
"github:postfinance/topf" = "0.6.0"
vals = "latest"
kustomize = "5.8.1"
"aqua:opentofu/opentofu" = "1"
oxfmt = "latest"
"aqua:yannh/kubeconform" = "latest"
"aqua:mikefarah/yq" = "latest"
prek = "latest"
"helm" = "latest"
"helmfile" = "latest"
"pipx:ansible" = "latest"
"pipx:ansible-core" = "latest"
"github:home-operations/flate" = "latest"
"github:home-operations/yamlls" = "latest"
