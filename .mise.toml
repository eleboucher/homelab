
[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
JUST_UNSTABLE = "1"

[tools]
"python" = "latest"
"uv" = "latest"
"github:mitsuhiko/minijinja" = "3.1.0"
"github:siderolabs/talos" = "v1.14.7"
"github:postfinance/topf" = "0.6.2"
vals = "latest"
kustomize = "5.8.3"
oxfmt = "latest"
"aqua:yannh/kubeconform" = "latest"
"aqua:mikefarah/yq" = "latest"
prek = "latest"
"helm" = "latest"
"helmfile" = "latest"
"github:home-operations/flate" = "latest"
"github:home-operations/yamlls" = "latest"
node = "26"
pulumi = "3.278.0"
