frr defaults traditional
log file stdout
!
router bgp 64513
  bgp router-id 192.168.1.1
  bgp log-neighbor-changes
  no bgp default ipv4-unicast
  !
  neighbor CILIUM peer-group
  neighbor CILIUM remote-as 64514
  neighbor CILIUM-V6 peer-group
  neighbor CILIUM-V6 remote-as 64514
  !
  neighbor 192.168.1.41 peer-group CILIUM
  neighbor 192.168.1.42 peer-group CILIUM
  neighbor 2a01:e0a:e4b:aa31::42 peer-group CILIUM-V6
  neighbor 2a01:e0a:e4b:aa31::43 peer-group CILIUM-V6
  !
  address-family ipv4 unicast
    neighbor CILIUM activate
    neighbor CILIUM soft-reconfiguration inbound
    neighbor CILIUM route-map CILIUM-IN in
    neighbor CILIUM route-map DENY-ALL out
  exit-address-family
  !
  address-family ipv6 unicast
    neighbor CILIUM-V6 activate
    neighbor CILIUM-V6 soft-reconfiguration inbound
    neighbor CILIUM-V6 route-map CILIUM-IN-V6 in
    neighbor CILIUM-V6 route-map DENY-ALL out
  exit-address-family
!
ip prefix-list CILIUM-LB seq 10 permit 192.168.69.0/24 le 32
!
ipv6 prefix-list CILIUM-LB-V6 seq 10 permit 2a01:e0a:e4b:aa32::/64 le 128
!
route-map CILIUM-IN permit 10
  match ip address prefix-list CILIUM-LB
!
route-map CILIUM-IN-V6 permit 10
  match ipv6 address prefix-list CILIUM-LB-V6
!
route-map DENY-ALL deny 10
!
line vty
!
