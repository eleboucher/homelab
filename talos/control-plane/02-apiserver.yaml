---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 127.0.0.1
  - 192.168.1.42
  - k8s.internal
env:
  GOMEMLIMIT: 3GiB
extraArgs:
  enable-aggregator-routing: "true"
  feature-gates: HPAScaleToZero=true
---
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  rules:
    - level: Metadata
