---
# No multi-doc equivalent for extraMounts; Talos always auto-generates a default
# KubeletConfig document that conflicts with any v1alpha1 machine.kubelet content,
# so delete the default and keep kubelet fully in v1alpha1 form.
apiVersion: v1alpha1
kind: KubeletConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.1.0/24
    - 2a01:e0a:e4b:aa31::/64
---
machine:
  kubelet:
    defaultRuntimeSeccompProfileEnabled: true
    extraMounts:
      # openebs-hostpath basePath — /var/mnt is read-only for kubelet unless bind-mounted
      - destination: /var/mnt/local-hostpath
        type: bind
        source: /var/mnt/local-hostpath
        options:
          - bind
          - rshared
          - rw
    extraConfig:
      # Let the Miroir agent detach DRBD backings after workloads stop.
      shutdownGracePeriod: 120s
      shutdownGracePeriodCriticalPods: 60s
      imageGCHighThresholdPercent: 70
      imageGCLowThresholdPercent: 50
      maxPods: 250
      serializeImagePulls: false
