apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 5m
---
apiVersion: v1alpha1
kind: ResolverConfig
# Use Quad9's dual-stack resolvers. Static LAN names needed by host workloads
# are defined below, so kubelet mounts do not depend on RouterOS DNS.
nameservers:
  - address: 9.9.9.9
  - address: 149.112.112.112
  - address: 2620:fe::fe
  - address: 2620:fe::9
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true # Requires Cilium socketLB features
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: StaticHostConfig
name: 192.168.1.40
hostnames:
  - normandie.internal
  - normandie
---
apiVersion: v1alpha1
kind: StaticHostConfig
name: 192.168.1.42
hostnames:
  - k8s.internal
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: fluent-bit
url: tcp://127.0.0.1:5170/
