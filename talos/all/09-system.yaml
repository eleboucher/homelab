apiVersion: v1alpha1
kind: WatchdogTimerConfig
device: /dev/watchdog0
timeout: 5m
---
apiVersion: v1alpha1
kind: ResolverConfig
# Use Cloudflare's dual-stack resolvers. Static LAN names needed by host workloads
# are defined below, so kubelet mounts do not depend on RouterOS DNS.
nameservers:
  - address: 1.1.1.1
  - address: 1.0.0.1
  - address: 2606:4700:4700::1111
  - address: 2606:4700:4700::1001
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true # Requires Cilium socketLB features
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: StaticHostConfig
name: 192.168.1.40
hostnames:
  - normandie.internal
  - normandie
---
apiVersion: v1alpha1
kind: StaticHostConfig
name: 192.168.1.42
hostnames:
  - k8s.internal
---
apiVersion: v1alpha1
kind: KmsgLogConfig
name: fluent-bit
url: tcp://127.0.0.1:5170/
